{% extends "base.html" %}
{% block content %}
  <h1>메인 페이지</h1>
  {% if username %}
    <p>반갑습니다, {{ username }} 님!</p>
    <p>
      <a href="{{ url_for('profile') }}?id={{ session.user_id|b64encode }}">
        내 프로필 보기
      </a>
    </p>
  {% else %}
    <p>로그인하지 않으셨습니다.</p>
  {% endif %}
{% endblock %}
